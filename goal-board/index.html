<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>目标看板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=18" />
  </head>
  <body>
    <div class="board" id="board">
      <div class="board-sticky">
        <header class="header">
          <div class="brand">
            <p class="brand-title"><span class="brand-mark"></span><span id="board-title">目标看板</span></p>
          </div>
          <section class="summary" id="summary"></section>
          <div class="clock">
            <span class="clock-period" id="clock-period"></span>
            <span class="clock-week" id="clock-week"></span>
            <span class="clock-time" id="clock-time"></span>
          </div>
        </header>
        <div class="goal-cols" aria-hidden="true">
          <span class="goal-col-no">序号</span>
          <span class="goal-col-title">目标</span>
          <div class="goal-stages">
            <span>讨论</span>
            <span>开发</span>
            <span>验收</span>
          </div>
        </div>
      </div>
      <div class="board-drum" id="board-drum">
        <div class="sight-band" aria-hidden="true"></div>
        <div class="board-scroll" id="board-scroll">
          <div id="board-loop">
            <div class="board-scroll-inner" id="board-scroll-inner">
              <div class="goal-list" id="goal-list"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="engine.js?v=14"></script>
    <script src="app.js?v=18"></script>
  </body>
</html>
