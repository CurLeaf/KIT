<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>目标看板</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body>
    <div class="board" id="board">
      <header class="header">
        <div class="brand">
          <p class="brand-title"><span class="brand-mark"></span><span id="board-title">目标看板</span></p>
        </div>
        <section class="summary" id="summary"></section>
        <div class="clock">
          <span class="clock-period" id="clock-period"></span>
          <span class="clock-week" id="clock-week"></span>
          <span class="clock-time" id="clock-time"></span>
        </div>
      </header>
      <div class="kanban" id="kanban">
        <section class="column" data-stage="discuss">
          <div class="column-head">
            <h2>讨论</h2>
            <span class="column-count" id="count-discuss">0</span>
          </div>
          <div class="column-notes" id="col-discuss"></div>
        </section>
        <section class="column" data-stage="develop">
          <div class="column-head">
            <h2>开发</h2>
            <span class="column-count" id="count-develop">0</span>
          </div>
          <div class="column-notes" id="col-develop"></div>
        </section>
        <section class="column" data-stage="accept">
          <div class="column-head">
            <h2>验收</h2>
            <span class="column-count" id="count-accept">0</span>
          </div>
          <div class="column-notes" id="col-accept"></div>
        </section>
      </div>
    </div>
    <script src="engine.js?v=15"></script>
    <script src="app.js?v=21"></script>
  </body>
</html>
